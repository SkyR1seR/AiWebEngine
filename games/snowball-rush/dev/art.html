<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Snowball Rush — art dev</title>
  <style>
    html, body { margin: 0; background: #0d1b33; color: #dfe8f4; font: 12px system-ui, sans-serif; overflow: hidden; }
    #strip { position: fixed; left: 0; right: 0; bottom: 0; max-height: 46vh; overflow: auto; background: rgba(13, 27, 51, .88); padding: 6px; }
    #strip.full { top: 0; max-height: none; }
    #strip h4 { margin: 6px 0 2px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
    .row img, .row canvas { image-rendering: pixelated; }
    .cell { display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 2px; }
  </style>
